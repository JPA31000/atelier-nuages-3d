# Publie automatiquement l'application sur GitHub Pages à chaque « push » sur la branche main.
# Réglage unique à faire une fois dans le dépôt :  Settings → Pages → Build and deployment → Source : « GitHub Actions ».
name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests (lecteurs, ICP, filtres, LAZ)
        run: npm test
      - name: Compilation (site 100 % statique dans dist/)
        run: npm run build
      # Si Pages est réglé sur « Deploy from a branch », GitHub publie en plus le code brut de la branche
      # (build Jekyll) et écrase ce site compilé. On bascule donc la source sur « GitHub Actions ».
      # Sans effet si c'est déjà le cas ; en cas de refus, un avertissement indique le réglage à faire à la main.
      - name: Source de Pages = GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          out=$(gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow 2>&1); code=$?
          echo "::notice title=Pages PUT::code=${code} $(echo "$out" | tr '\n' ' ' | cut -c1-300)"
          cur=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '"build_type=" + .build_type + " branche=" + (.source.branch // "-") + " dossier=" + (.source.path // "-")' 2>&1 | tr '\n' ' ' | cut -c1-300)
          echo "::notice title=Pages actuel::${cur}"
          case "$cur" in *build_type=workflow*) ;; *)
            echo "::warning title=Réglage de Pages::La source n'est pas « GitHub Actions ». Faites-le à la main : Settings → Pages → Build and deployment → Source : GitHub Actions." ;;
          esac
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

# Publie automatiquement l'application sur GitHub Pages à chaque « push » sur la branche main.
#
# Réglage recommandé (une seule fois) : Settings → Pages → Build and deployment → Source : « GitHub Actions ».
#
# Si la source de Pages est restée sur « Deploy from a branch », GitHub lance en plus, à chaque push, son propre
# déploiement du code BRUT de la branche (build Jekyll) : il écrase ce site compilé s'il se termine après lui.
# L'étape « Attendre… » ci-dessous fait donc passer notre déploiement APRÈS celui-là : le site compilé a toujours
# le dernier mot, quel que soit le réglage. (Avec « GitHub Actions », ce déploiement n'existe pas : l'attente est brève.)
name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests (lecteurs, ICP, filtres, LAZ)
        run: npm test
      - name: Compilation (site 100 % statique dans dist/)
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Attendre la fin du déploiement « branche » de GitHub, s'il existe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            st=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=30" \
              --jq '[.workflow_runs[] | select(.path == "dynamic/pages/pages-build-deployment")][0].status // "absent"')
            echo "tentative ${i} : déploiement de la branche = ${st}"
            [ "${st}" = "completed" ] && break
            [ "${st}" = "absent" ] && [ "${i}" -ge 4 ] && break
            sleep 8
          done
      - id: deployment
        uses: actions/deploy-pages@v4
